<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ece4d4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1914" media="(prefers-color-scheme: dark)">
<title>Hollowdeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Hollowdeep styles. Tokens first, then layout, then components. */
:root {
  --bg: #d8d3c4; --bg2: #cfc8b6; --panel: #c6bea9; --ink: #2a221c; --ink2: #5a4d40; --line: #978a73;
  --blood: #8f1f2f; --lichen: #3f6b3a; --brass: #86620f; --focus: #1f4f8a;
  --parch: #efe5cf; --parch2: #e3d6b8; --pink: #2a221c;
  --wax: #8e2a22; --wax2: #b8433a;
  --atk: #8e3b2e; --skl: #2f6f68; --pow: #6a4d93; --sts: #6d675e; --tok: #8a7a52;
  --disp: 'Grenze Gotisch', 'Iowan Old Style', Georgia, serif;
  --text: 'Alegreya', 'Iowan Old Style', Georgia, serif;
  --cw: 150px; --ch: 216px; --ah: 82px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #221b16; --bg2: #2a221c; --panel: #332922; --ink: #ece2cc; --ink2: #b9ab92; --line: #5c4d3f;
    --blood: #d0485a; --lichen: #8fb08a; --brass: #d9a93e; --focus: #8fb8ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #221b16; --bg2: #2a221c; --panel: #332922; --ink: #ece2cc; --ink2: #b9ab92; --line: #5c4d3f;
  --blood: #d0485a; --lichen: #8fb08a; --brass: #d9a93e; --focus: #8fb8ff;
  color-scheme: dark;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--text); font-size: 16px; line-height: 1.45;
  font-variant-numeric: lining-nums tabular-nums;
}
#app { min-height: 100%; display: flex; flex-direction: column; }
h1, h2, h3 { font-family: var(--disp); font-weight: 500; line-height: 1.1; margin: 0 0 .4em; letter-spacing: .01em; }
h1 { font-size: clamp(3rem, 9vw, 5.5rem); }
h2 { font-size: 1.9rem; }
h3 { font-size: 1.3rem; margin-top: 1.1em; }
p { margin: 0 0 .8em; max-width: 64ch; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.fine { font-size: .9rem; color: var(--ink2); }
.lbl { color: var(--ink2); font-size: .85em; margin-right: .2em; }

button.primary, button.ghost, button.loot, button.choice {
  border-radius: 8px; padding: .55em 1.1em; border: 1.5px solid var(--line); background: var(--panel);
}
button.primary { background: var(--wax); color: #f6ead2; border-color: var(--wax); font-weight: 700; }
button.primary:hover:not(:disabled) { background: var(--wax2); }
button.ghost { background: transparent; }
button.ghost:hover:not(:disabled), button.loot:hover:not(:disabled), button.choice:hover { border-color: var(--ink2); }
button.small { font-size: .85rem; padding: .35em .8em; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.loot { display: block; width: 100%; max-width: 640px; text-align: left; margin: 0 0 .6em; }

/* ---------- top bar ---------- */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1.1rem;
  padding: .55rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel);
}
.bar .who { font-family: var(--disp); font-size: 1.35rem; }
.bar .hp { color: var(--blood); font-weight: 700; }
.bar .gold { color: var(--brass); font-weight: 700; }
.relics { display: flex; flex-wrap: wrap; gap: .3rem; }
.relic { font-size: .8rem; padding: .1em .55em; border: 1px solid var(--line); border-radius: 999px; cursor: help; }

/* ---------- title ---------- */
.title { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem 1rem 3rem; }
.title h1 { margin-bottom: .1em; }
.lede { font-size: 1.15rem; color: var(--ink2); }
.roster { display: flex; flex-wrap: wrap; justify-content: center; gap: .8rem; margin: 1.6rem 0 1.4rem; }
.hero {
  width: 170px; min-height: 230px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--panel);
  display: flex; flex-direction: column; align-items: center; gap: .35rem; padding: 1rem .8rem; text-align: center;
}
.hero .hname { font-family: var(--disp); font-size: 1.45rem; }
.hero .hsub { font-size: .85rem; color: var(--ink2); }
.hero .go { margin-top: auto; background: var(--wax); color: #f6ead2; border-radius: 8px; padding: .3em 1em; font-weight: 700; }
button.hero:hover { border-color: var(--wax); }
.hero.locked { opacity: .55; justify-content: center; border-style: dashed; }
.seed { display: flex; gap: .5rem; align-items: center; margin-bottom: .8rem; }
.seed input { font: inherit; padding: .35em .6em; border-radius: 6px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); width: 9rem; }

/* ---------- sigils ---------- */
.sigil .body { fill: var(--panel); stroke: var(--ink); stroke-width: 3; }
.sigil .eye { fill: var(--blood); }
.sigil.me .body { fill: var(--panel); stroke: var(--brass); stroke-width: 4; }
.sigil.me .eye { fill: var(--wax2); }

/* ---------- map ---------- */
.mapwrap { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 1rem; padding: 1rem; min-height: 0; }
.map { overflow: auto; max-height: calc(100vh - 80px); text-align: center; border-radius: 12px; }
.map .hint { margin: 0 auto .4rem; color: var(--ink2); }
.mapsvg { max-width: 100%; height: auto; overflow: visible; }
.mapsvg line { stroke: var(--line); stroke-width: 2; stroke-dasharray: 3 6; }
.mapsvg line.trod { stroke: var(--ink); stroke-dasharray: none; stroke-width: 3; }
.node circle { fill: var(--bg); stroke: var(--line); stroke-width: 2; }
.node { color: var(--ink2); }
.node.visited { color: var(--ink2); opacity: .55; }
.node.here { opacity: 1; }
.node.here circle { stroke: var(--ink); stroke-width: 3; }
.node.reach { cursor: pointer; color: var(--ink); }
.node.reach circle { stroke: var(--wax); stroke-width: 3; fill: var(--panel); }
.node.reach:hover circle, .node.reach:focus circle { fill: var(--wax); }
.node.reach:hover, .node.reach:focus { color: #f6ead2; outline: none; }
.node.n-elite { color: var(--blood); }
.node.n-rest { color: var(--brass); }
.node.n-boss circle { stroke-width: 3; }
.node.n-boss { color: var(--blood); }
.bosslbl { font-family: var(--disp); font-size: 20px; fill: var(--ink); }
@media (prefers-reduced-motion: no-preference) {
  .node.reach circle { animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe { 50% { stroke-width: 5; } }
}
.side { border-left: 1px solid var(--line); padding-left: 1rem; font-size: .92rem; }
.side ul { list-style: none; padding: 0; margin: 0; }
.legend li { display: flex; align-items: center; gap: .5rem; margin-bottom: .3rem; flex-wrap: wrap; }
.legend svg { color: var(--ink); }
.legend svg.n-elite { color: var(--blood); } .legend svg.n-rest { color: var(--brass); }
.legend .note { flex-basis: 100%; padding-left: 1.9rem; font-size: .8rem; color: var(--ink2); margin-top: -.2rem; }
.rlist li { margin-bottom: .45rem; }

/* ---------- combat ---------- */
.combat { flex: 1; display: grid; grid-template-rows: 1fr auto auto; min-height: 0; position: relative; }
.arena { display: flex; justify-content: space-between; align-items: center; gap: 1.5rem; padding: 1.2rem 1.5rem .4rem; flex-wrap: wrap; }
.foes { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: flex-end; gap: 1.1rem; }
.me, .foe { display: flex; flex-direction: column; align-items: center; gap: .25rem; min-width: 118px; border-radius: 12px; padding: .4rem .5rem; border: 2px solid transparent; }
.fname { font-family: var(--disp); font-size: 1.2rem; text-align: center; }
.tkey { display: inline-block; min-width: 1.3em; margin-right: .3em; border-radius: 4px; background: var(--ink); color: var(--bg); font-family: var(--text); font-size: .8rem; }
.foe.targetable { cursor: crosshair; border-color: var(--line); border-style: dashed; }
.foe.targetable:hover, .foe.targetable:focus { border-color: var(--wax); border-style: solid; }
.hpbar { position: relative; width: 118px; height: 14px; border-radius: 7px; background: var(--panel); border: 1px solid var(--line); }
.hptxt { position: absolute; inset: 0; text-align: center; font-size: .72rem; line-height: 13px; font-weight: 700; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.gbadge { position: absolute; left: -14px; top: -7px; min-width: 26px; height: 26px; border-radius: 50% 50% 45% 45%; background: var(--lichen); color: #10170f; font-weight: 700; font-size: .8rem; display: grid; place-items: center; border: 2px solid var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: .2rem; justify-content: center; max-width: 170px; }
.chip { font-size: .72rem; border-radius: 4px; padding: 0 .4em; border: 1px solid var(--line); cursor: help; }
.chip.buff { border-color: var(--lichen); }
.chip.debuff { border-color: var(--blood); color: var(--blood); }
.intent { display: flex; align-items: center; gap: .2rem; min-height: 26px; font-weight: 700; font-size: 1.05rem; }
.intent .ico { width: 20px; height: 20px; }
.intent.k-attack { color: var(--blood); }
.intent.k-defend { color: var(--lichen); }
.intent.k-buff { color: var(--brass); }
.intent.k-debuff, .intent.k-summon { color: var(--pow); }
.intent.k-sleep, .intent.k-stun, .intent.k-unknown { color: var(--ink2); }
.combat > .hint { text-align: center; min-height: 1.5em; margin: 0 auto; color: var(--ink2); }
.dock { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: end; gap: .8rem; padding: .3rem 1rem 1rem; }
.dock .left, .dock .right { display: flex; flex-direction: column; gap: .4rem; align-items: stretch; }
.energy {
  width: 72px; height: 72px; display: grid; place-items: center; align-self: center;
  border-radius: 47% 53% 49% 51% / 52% 48% 52% 48%;
  background: radial-gradient(circle at 38% 32%, var(--wax2), var(--wax) 62%, #5e1a14);
  color: #f6ead2; font-family: var(--disp); box-shadow: inset 0 -4px 0 rgba(0,0,0,.25);
}
.energy span { font-size: 2rem; line-height: 1; }
.energy small { font-size: .9rem; margin-top: -1.2rem; opacity: .85; }
.hand { display: flex; justify-content: center; align-items: flex-end; padding: 34px 0 10px; min-height: calc(var(--ch) + 50px); overflow: visible; }
.hand .empty { align-self: center; color: var(--ink2); }
.log { position: absolute; right: 1rem; top: .5rem; width: min(320px, 70vw); max-height: 40%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .5rem .8rem; font-size: .85rem; }
.log p { margin: 0 0 .15rem; }

/* ---------- cards ---------- */
.card {
  position: relative; flex: 0 0 auto; width: var(--cw); height: var(--ch); border-radius: 10px;
  background: linear-gradient(180deg, var(--parch), var(--parch2)); color: var(--pink);
  border: 3px solid var(--frame, var(--sts)); padding: 1.35rem .5rem .45rem;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: .15rem;
  box-shadow: 0 2px 0 rgba(0,0,0,.18);
}
.card.t-attack { --frame: var(--atk); }
.card.t-skill { --frame: var(--skl); }
.card.t-power { --frame: var(--pow); border-radius: 10px 10px 40% 40% / 10px 10px 16px 16px; }
.card.t-status { --frame: var(--sts); }
.card.r-token { --frame: var(--tok); }
.cname { font-family: var(--disp); font-size: 1.06rem; line-height: 1.05; padding-bottom: .18rem; border-bottom: 2px solid transparent; }
.card.r-uncommon .cname { border-bottom-color: var(--skl); }
.card.r-rare .cname { border-bottom-color: #b8891d; }
.card.r-ancient .cname { border-bottom-color: var(--wax); }
.card.up .cname { color: #2f6a2a; }
.ctype { font-size: .7rem; font-style: italic; color: #6a5c4c; }
.ctext { font-size: .8rem; line-height: 1.28; margin-top: .15rem; }
.ctext b { font-weight: 700; }
.num.hi { color: #2f6a2a; font-weight: 700; }
.num.lo { color: #a02a2a; font-weight: 700; }
.seal {
  position: absolute; left: -9px; top: -9px; width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 47% 53% 49% 51% / 52% 48% 52% 48%;
  background: radial-gradient(circle at 38% 32%, var(--wax2), var(--wax) 62%, #5e1a14);
  color: #f6ead2; font-family: var(--disp); font-size: 1.2rem; box-shadow: 0 1px 0 rgba(0,0,0,.3);
}
.seal.cheap { background: radial-gradient(circle at 38% 32%, #6aa35f, #2f6a2a 62%, #1b3d18); }
.seal.dear { outline: 2px solid var(--blood); }
.key { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); font-size: .7rem; color: #7b6d5b; }
.price { margin-top: auto; font-weight: 700; color: #6b4d09; font-size: .85rem; }
.price.sale { color: #2f6a2a; }
.card.playable, .card[role="button"] { cursor: pointer; }
.pickrow .card:hover, .grid .card[role="button"]:hover { transform: translateY(-4px); }
.card.sel { box-shadow: 0 0 0 3px var(--focus); }
.card.dim { filter: saturate(.35) brightness(.88); }
.card.dim .seal { background: #6d675e; }
.card.sold { display: grid; place-items: center; font-family: var(--disp); opacity: .5; border-style: dashed; }
.tips { display: none; pointer-events: none; position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); width: 220px; z-index: 20;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: .45rem .6rem; text-align: left; font-size: .78rem; }
.tips span { display: block; margin-bottom: .25rem; }
.card:hover .tips, .card:focus-visible .tips { display: block; }
.grid .card:hover .tips, .pickrow .card:hover .tips { bottom: auto; top: calc(100% + 6px); }

/* ---------- panels ---------- */
.panel { flex: 1; width: 100%; max-width: 860px; margin: 0 auto; padding: 1.6rem 1rem 3rem; }
.panel > .primary { margin-top: 1.2rem; }
.pickrow { display: flex; flex-wrap: wrap; gap: 1.1rem; padding: .8rem 0 1rem 10px; }
.choices { display: flex; flex-wrap: wrap; gap: 1rem; }
button.choice { display: flex; flex-direction: column; align-items: flex-start; gap: .2rem; width: 240px; padding: 1rem 1.2rem; text-align: left; }
button.choice b { font-family: var(--disp); font-size: 1.6rem; font-weight: 500; }
.end { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }

/* ---------- overlay ---------- */
.overlay { position: fixed; inset: 0; background: rgba(15, 10, 8, .6); display: grid; place-items: center; z-index: 50; padding: 1rem; }
.sheet { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; width: min(980px, 100%); max-height: 88vh; overflow: auto; padding: 1rem 1.2rem 1.4rem; }
.shead { display: flex; justify-content: space-between; align-items: center; gap: 1rem; position: sticky; top: -1rem; background: var(--bg); padding: .4rem 0; z-index: 30; }
.grid { display: flex; flex-wrap: wrap; gap: 1rem; padding: .6rem 0 .6rem 10px; }

/* ---------- floating numbers ---------- */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.float { position: fixed; transform: translate(-50%, 0); font-family: var(--disp); font-size: 1.9rem; font-weight: 700; text-shadow: 0 1px 0 rgba(0,0,0,.35), 0 0 6px var(--bg); }
.float.big { font-size: 2.6rem; }
.f-hit { color: var(--blood); }
.f-guard { color: var(--lichen); }
.f-heal { color: var(--lichen); }
.f-block { color: var(--ink2); font-size: 1.05rem; }
@media (prefers-reduced-motion: no-preference) {
  .float { animation: rise 1s ease-out forwards; }
  @keyframes rise {
    0% { opacity: 0; transform: translate(-50%, 6px) scale(.6); }
    14% { opacity: 1; transform: translate(-50%, -6px) scale(1.25); }
    30% { transform: translate(-50%, -12px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -58px) scale(1); }
  }
}

/* ---------- small screens ---------- */
@media (max-width: 760px) {
  :root { --cw: 108px; --ch: 162px; --ah: 54px; }
  .mapwrap { grid-template-columns: 1fr; }
  .side { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: .8rem; }
  .map { max-height: none; }
  .arena { padding: .6rem .6rem .2rem; justify-content: center; }
  .foes { justify-content: center; gap: .5rem; }
  .me, .foe { min-width: 96px; }
  .hpbar { width: 96px; }
  .dock { grid-template-columns: auto 1fr; grid-template-areas: "hand hand" "left right"; padding: .2rem .5rem .6rem; }
  .dock .hand { grid-area: hand; justify-content: flex-start; padding-left: 12px; overflow-x: auto; }
  .dock .left { grid-area: left; flex-direction: row; align-items: center; }
  .dock .right { grid-area: right; flex-direction: row; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .energy { width: 56px; height: 56px; }
  .energy span { font-size: 1.6rem; }
  .ctext { font-size: .7rem; }
  .cname { font-size: .92rem; }
  .card { padding: 1.1rem .35rem .35rem; }
  .bar { gap: .3rem .8rem; padding: .45rem .6rem; }
}

/* ---------- potions ---------- */
.belt { display: flex; gap: .3rem; align-items: center; }
.vial {
  max-width: 128px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: .78rem; padding: .15em .7em; border-radius: 999px 999px 999px 999px / 60% 60% 100% 100%;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
}
.vial.r-common { border-color: var(--ink2); }
.vial.r-uncommon { border-color: var(--skl); }
.vial.r-rare { border-color: #b8891d; }
.vial.r-token { border-color: var(--tok); }
.vial.sel { outline: 3px solid var(--focus); }
.vial.empty { display: inline-block; width: 22px; height: 22px; border-radius: 50% 50% 45% 45%; border-style: dashed; padding: 0; background: transparent; }
.sheet.small { width: min(460px, 100%); }
.loot i { display: block; font-size: .85rem; color: var(--ink2); }
.pickgroup { margin: .4rem 0 1rem; }
.pickgroup h3 { margin-top: .6rem; }
@media (max-width: 760px) { .vial { max-width: 92px; } }

/* ---------- startup and error states ---------- */
.boot { margin: auto; padding: 3rem 1.5rem; max-width: 560px; text-align: center; color: var(--ink2); }
.boot.err { color: var(--ink); }
.boot.err h2 { color: var(--blood); }
#errbar { position: fixed; left: 1rem; right: 1rem; bottom: 1rem; z-index: 50; background: var(--panel); border: 2px solid var(--blood); border-radius: 12px; }
#errbar .boot { padding: 1rem; max-width: none; }

/* ---------- motion and interaction ---------- */
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#app { position: relative; z-index: 1; }
button:active:not(:disabled) { transform: translateY(1px); }

/* Hand: a shallow fan that straightens and lifts the card you point at. */
.hand .card {
  transform: translateY(var(--y, 0)) rotate(var(--r, 0));
  transform-origin: 50% 115%;
  transition: transform .16s ease-out, margin .2s ease-out, opacity .15s, filter .15s;
  touch-action: none; /* cards are dragged to play; the hand never scrolls */
  user-select: none; -webkit-user-select: none;
}
.hand .card:hover, .hand .card:focus-visible { transform: translateY(-34px) rotate(0) scale(1.1); z-index: 5; }
.hand .card.sel { transform: translateY(-46px) rotate(0) scale(1.12); z-index: 6; }
.hand .card.playable:hover { box-shadow: 0 10px 22px rgba(0,0,0,.28), 0 0 0 2px var(--frame, var(--sts)); }
.hand .card.ghost { opacity: .22; filter: grayscale(1); }
.hand .card.gone { visibility: hidden; }
.card.flying { pointer-events: none; z-index: 70; box-shadow: 0 14px 30px rgba(0,0,0,.35); }
.card.flying .tips, .card.flying .key { display: none; }
.card.held { transition: transform .16s ease-out; }
.card.held.armed { box-shadow: 0 0 0 3px var(--frame, var(--sts)), 0 18px 34px rgba(0,0,0,.4); }

/* Aim line from a held card to the pointer. */
#aim { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 65; display: none; overflow: visible; }
#aim.on { display: block; }
#aimpath, #aimtrail { fill: none; stroke-linecap: round; stroke-dasharray: 1 14; }
#aimtrail { stroke: rgba(0,0,0,.35); stroke-width: 12; }
#aimpath { stroke: var(--wax2); stroke-width: 8; }
#aimhead path { fill: var(--wax2); }
#aim.lock #aimpath { stroke: var(--brass); stroke-width: 10; }
#aim.lock #aimhead path { fill: var(--brass); }
.foe.aimed { border-color: var(--brass); border-style: solid; background: color-mix(in srgb, var(--panel) 55%, transparent); }

/* Creatures: breathe while idle, lunge when acting, sink when killed. */
.sigil { transform-origin: 50% 90%; }
.foe.acting { border-color: var(--blood); }
.foe.dying, .foe.fled { pointer-events: none; }
.hpbar .lag { position: absolute; inset: 0 auto 0 0; border-radius: 7px; background: var(--brass); opacity: .75; }
.hpbar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 7px; background: var(--blood); }
.energy.spent { filter: saturate(.25) brightness(.75); }

.banner {
  position: fixed; left: 50%; top: 36%; transform: translate(-50%, -50%);
  text-align: center; padding: .5rem 7rem; white-space: nowrap;
  background: linear-gradient(90deg, transparent, var(--panel) 22%, var(--panel) 78%, transparent);
  color: var(--ink); font-family: var(--disp);
}
.banner b { display: block; font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 500; line-height: 1.1; }
.banner small { font-family: var(--text); font-size: .95rem; color: var(--ink2); }
.hurt { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, color-mix(in srgb, var(--blood) 70%, transparent) 100%); }

@media (prefers-reduced-motion: no-preference) {
  .foe .sigil, .me .sigil { animation: idle 3.4s ease-in-out infinite; animation-delay: var(--d, 0ms); }
  @keyframes idle { 50% { transform: scale(1.025, .975); } }
  .foe.acting .sigil { animation: lunge .46s ease-out; }
  @keyframes lunge { 40% { transform: translateX(-34px) scale(1.06); } }
  .intent { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .foe.dying { animation: die .7s ease-in forwards; }
  @keyframes die { 25% { filter: brightness(2.2) saturate(0); } 100% { opacity: 0; transform: translateY(22px) scale(.88); filter: grayscale(1); } }
  .foe.fled { animation: flee .6s ease-in forwards; }
  @keyframes flee { to { opacity: 0; transform: translateX(90px); } }
  .hpbar .fill { transition: width .18s ease-out; }
  .hpbar .lag { transition: width .5s ease-in .35s; }
  .gbadge { animation: pop .3s ease-out; }
  @keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .chip { animation: pop .25s ease-out; }
  .primary.nudge { animation: nudge 1.5s ease-in-out infinite; }
  @keyframes nudge { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--wax2) 35%, transparent); } }
  main { animation: enter .28s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
  .overlay { animation: fade .16s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .sheet { animation: rise-in .22s ease-out; }
  @keyframes rise-in { from { opacity: 0; transform: translateY(18px) scale(.98); } }
  .pickrow .card { animation: deal .38s cubic-bezier(.2,.7,.3,1) both; animation-delay: calc(var(--i, 0) * 70ms); }
  @keyframes deal { from { opacity: 0; transform: translateY(26px) rotate(-5deg); } }
  .pickrow .card[role="button"] { transition: transform .14s ease-out, box-shadow .14s; }
  .pickrow .card[role="button"]:hover { transform: translateY(-6px); box-shadow: 0 10px 20px rgba(0,0,0,.25); }
  .mapsvg line.next { stroke: var(--wax); stroke-dasharray: 3 6; animation: march 1s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -9; } }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (max-width: 760px) {
  .arena { flex-direction: column; flex-wrap: nowrap; gap: .1rem; padding: .3rem .4rem 0; }
  .foes { flex-wrap: nowrap; gap: .2rem; justify-content: center; }
  .me .sigil { width: 64px; height: 64px; }
  .foe .sigil { width: 58px; height: 58px; }
  .me, .foe { min-width: 0; padding: .15rem .25rem; gap: .1rem; }
  .fname { font-size: .82rem; text-align: center; }
  .foe .hpbar { width: 82px; }
  .intent { min-height: 20px; font-size: .9rem; }
  .combat > .hint { font-size: .85rem; }
  .hand .card { transform: none; }
  .hand .card:hover, .hand .card:focus-visible { transform: translateY(-14px); }
  .hand .card.sel { transform: translateY(-22px); }
  .banner { padding: .4rem 3rem; }
}

/* ---------- map start and name setting ---------- */
.node.n-start circle { fill: var(--panel); stroke: var(--brass); stroke-width: 3; }
.node.n-start { color: var(--brass); }
.startlbl { font-family: var(--disp); font-size: 18px; fill: var(--ink2); }
.names { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-top: .6rem; }
.names .seg { border: 0; border-radius: 0; background: transparent; color: var(--ink2); padding: .3em .9em; font-size: .85rem; }
.names .seg.on { background: var(--ink); color: var(--bg); }
.side .names { margin-top: .2rem; }

/* ---------- ancients, curses, leaps ---------- */
.ancient .choices { margin-top: 1rem; }
button.choice.gift { width: 250px; min-height: 150px; justify-content: flex-start; }
button.choice.gift b { font-size: 1.35rem; }
button.choice.gift em { margin-top: auto; font-size: .85rem; color: var(--blood); font-style: normal; }
button.choice.gift.bane { border-color: var(--blood); border-style: dashed; }
.card.t-curse { --frame: #4a3a52; }
.card.r-curse .cname { border-bottom-color: #4a3a52; }
.node.reach.leap circle { stroke-dasharray: 4 3; }

/* ---------- illustrated card layout ---------- */
.card { padding: .38rem .38rem .55rem; gap: .2rem; }
.hand .card { margin: 0 var(--m, 3px); }
.cname {
  width: 100%; padding: .12rem .35rem .12rem 1rem; border: 0; border-radius: 5px;
  background: var(--band, #d8caa8); color: var(--band-ink, #2a221c);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1rem;
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.18);
}
.cname.n2 { font-size: .88rem; }
.cname.n3 { font-size: .76rem; }
.card.r-uncommon { --band: #3d6d8a; --band-ink: #f2ecdf; }
.card.r-rare { --band: #c29426; --band-ink: #2a1a04; }
.card.r-ancient { --band: #8e2f22; --band-ink: #f6e6cc; }
.card.r-curse { --band: #4a3a52; --band-ink: #efe2f2; }
.card.r-status, .card.r-token { --band: #7b746a; --band-ink: #f2ede4; }
.card.up .cname { color: var(--band-up, #2f6a2a); }
.card.r-uncommon, .card.r-ancient, .card.r-curse, .card.r-status, .card.r-token { --band-up: #c6f2a8; }
.card.r-rare { --band-up: #1e4d10; }
.card.r-uncommon .cname, .card.r-rare .cname, .card.r-ancient .cname { border-bottom: 0; }
.cart { display: block; flex: 0 0 auto; width: 100%; height: var(--ah); padding: 2px; background: var(--frame, var(--sts)); border-radius: 6px; overflow: hidden; }
.cart img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 4px; -webkit-user-drag: none; user-select: none; }
.card.t-attack .cart, .card.t-attack .cart img { border-radius: 0; clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%); }
.card.t-power .cart { border-radius: 50% / 46%; }
.card.t-power .cart img { border-radius: 50% / 46%; }
.ctype {
  align-self: center; margin-top: -11px; position: relative; z-index: 1;
  background: var(--parch); border: 1.5px solid var(--frame, var(--sts)); border-radius: 999px;
  padding: 0 .6em; font-size: .62rem; font-style: normal; line-height: 1.45; color: #4a3f33;
}
.ctext { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; margin-top: 0; font-size: .74rem; line-height: 1.22; }
.ctext.long { font-size: .66rem; }
.card .key { bottom: 2px; }
.card.sold { width: var(--cw); height: var(--ch); }
@media (max-width: 760px) {
  .cname { font-size: .8rem; padding-left: .8rem; }
  .cname.n2 { font-size: .72rem; }
  .cname.n3 { font-size: .64rem; }
  .ctype { font-size: .54rem; margin-top: -9px; }
  .ctext { font-size: .62rem; }
  .ctext.long { font-size: .55rem; }
  .card { padding: .3rem .3rem .45rem; }
  .hand .card { margin: 0 2px; }
}

.toggles { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; margin: .2rem 0 .8rem; }

/* ---------- header: stats, deck, and one strip for potions and relics ---------- */
.bar .stats { display: flex; align-items: center; gap: .4rem 1.1rem; }
.bar .inv { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .8rem; min-width: 0; }
@media (min-width: 1101px) { .bar .inv { display: contents; } }
.relic { cursor: pointer; white-space: nowrap; }
.relic:hover, .relic:focus-visible { border-color: var(--ink2); }
.chip[role="button"], .foe[role="button"]:not(.targetable) { cursor: pointer; }
.vial .vshort { display: none; }
@media (max-width: 1100px) {
  .bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .3rem .9rem; }
  .bar .inv {
    grid-column: 1 / -1; flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain;
    scrollbar-width: none; padding-bottom: 1px; -webkit-mask-image: linear-gradient(90deg, #000 90%, transparent);
  }
  .bar .inv::-webkit-scrollbar { display: none; }
  .bar .belt, .bar .relics { flex: 0 0 auto; flex-wrap: nowrap; }
}
@media (max-width: 760px) {
  .bar { grid-template-columns: minmax(0, 1fr) auto; gap: .3rem .5rem; padding: .35rem .5rem .4rem; }
  .bar .who { display: none; }
  .bar .stats { gap: .75rem; font-size: .92rem; white-space: nowrap; }
  .bar .deckbtn { padding: .2em .7em; font-size: .85rem; }
  .bar .inv { gap: .3rem; }
  .relic { font-size: .75rem; }
  .vial { max-width: none; min-width: 2.1rem; padding: .15em .45em; text-align: center; }
  .vial .vfull { display: none; }
  .vial .vshort { display: inline; font-weight: 700; letter-spacing: .02em; }
}

/* ---------- info sheets and the card inspector ---------- */
.sheet.mid { width: min(620px, 100%); }
.infotext p { margin: 0 0 .55rem; white-space: pre-line; }
.inspect { display: flex; flex-wrap: wrap; gap: 1.2rem; align-items: flex-start; }
.inspect .infotext { flex: 1 1 200px; min-width: 0; }
.card.big { --cw: 210px; --ch: 300px; --ah: 118px; width: var(--cw); height: var(--ch); flex: 0 0 auto; }
.card.big .cname { font-size: 1.3rem; padding-left: 1.4rem; }
.card.big .ctext { font-size: 1rem; }
.card.big .ctype { font-size: .78rem; margin-top: -13px; }
.card.big .seal { width: 40px; height: 40px; font-size: 1.5rem; left: -11px; top: -11px; }
.title .continue { margin: .4rem 0 .8rem; }
@media (max-width: 760px) {
  .card.big { --cw: 180px; --ch: 258px; --ah: 100px; }
  .card.big .cname { font-size: 1.1rem; }
  .card.big .ctext { font-size: .88rem; }
}

/* ---------- events ---------- */
.event .evtext { max-width: 62ch; font-size: 1.05rem; line-height: 1.55; }
.event .choices { margin-top: 1rem; }
button.choice.evopt { width: 250px; min-height: 120px; justify-content: flex-start; }
button.choice.evopt b { font-size: 1.2rem; }
button.choice.evopt em { margin-top: auto; font-size: .85rem; font-style: normal; color: var(--ink2); }
button.choice.evopt:disabled { opacity: .55; }
.card.t-quest { --frame: #8a6a2e; }
.card.r-quest, .card.r-event { --band: #8a6a2e; --band-ink: #fbf1d9; --band-up: #d8f5b8; }
@media (max-width: 760px) { button.choice.evopt { width: 100%; min-height: 0; } }

/* ---------- facing (flanking bosses) ---------- */
.foe.faced { border-color: var(--brass); border-style: solid; }
.foe.faced .fname::after { content: ' (facing)'; font-size: .75em; color: var(--ink2); }

/* ---------- bound cards (Chains of Binding) ---------- */
.card.bound { outline: 3px dashed #8a7a9a; outline-offset: -5px; }
.card.bound .ctype::after { content: ' · Bound'; }

/* ---------- colorless cards ---------- */
.card.col-colorless { --frame: #8b8780; }

/* ---------- pickups and icons ---------- */
.ricon, .picon { width: 34px; height: 34px; flex: 0 0 auto; }
.coin { width: 1.1em; height: 1.1em; vertical-align: -0.18em; margin-right: .35em; }
.loot { display: flex; align-items: center; gap: .7rem; text-align: left; }
.loot > span { flex: 1; }
.relic { display: inline-flex; align-items: center; gap: .3em; }
.chipicon { width: 1.25em; height: 1.25em; flex: 0 0 auto; }
.showcase {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -55%);
  display: flex; flex-direction: column; align-items: center; gap: 1.4rem;
  width: min(94vw, 1100px); pointer-events: none; z-index: 80;
}
.show-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 1rem; }
.show-relic, .show-potion { display: flex; flex-direction: column; align-items: center; gap: .3rem; max-width: 210px; text-align: center;
  padding: .8rem 1rem; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1.5px solid var(--brass); border-radius: 14px; box-shadow: 0 14px 34px rgba(0,0,0,.4); }
.show-relic .medal { width: 84px; height: 84px; filter: drop-shadow(0 0 14px rgba(243,198,90,.55)); }
.show-relic b, .show-potion b { font-family: var(--disp); font-size: 1.25rem; color: var(--ink); }
.show-relic small { color: var(--ink2); font-size: .85rem; line-height: 1.3; }
.show-potion .bottle { width: 64px; height: 64px; }
.show-card { position: relative; }
.show-card .card { box-shadow: 0 14px 34px rgba(0,0,0,.45); }
.show-card.upgraded .card { box-shadow: 0 0 0 3px #7fc76b, 0 14px 34px rgba(0,0,0,.45); }
.show-tag { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); background: var(--blood); color: #fff3e6; font-size: .8rem; padding: .1em .6em; border-radius: 999px; white-space: nowrap; }
.show-tag.up { background: #3f7a35; }
.show-num { font-family: var(--disp); font-size: 2.4rem; color: #e3b341; text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 0 10px var(--bg); display: flex; align-items: center; }
.show-num.maxhp { color: #e05a5a; }
.show-num.neg { color: var(--ink2); }
@media (max-width: 760px) {
  .showcase { top: 40%; gap: .5rem; }
  .show-relic { max-width: 150px; padding: .5rem .6rem; }
  .show-relic .medal { width: 52px; height: 52px; }
  .show-relic b { font-size: 1rem; }
  .show-relic small { display: none; }
  .show-num { font-size: 1.8rem; }
}

.show-dim { position: fixed; inset: 0; pointer-events: none; z-index: 79; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,.55), rgba(0,0,0,.15) 70%); }
@media (prefers-reduced-motion: no-preference) { .show-dim { animation: fade .2s ease-out; } }

/* ---------- enchantments ---------- */
.ench { display: inline-block; color: #8a4fc7; font-weight: 700; font-style: italic; margin-right: .2em; }
.card.enchanted { box-shadow: 0 0 0 2px #9b6ad6, 0 2px 0 rgba(0,0,0,.18); }
.card.enchanted .cname::before { content: '\2726'; margin-right: .25em; color: #b88af0; }
.show-tag.ench { background: #6c3fa8; }

/* ---------- choice sheets (relics, potions) ---------- */
button.choice.loot { flex-direction: row; align-items: flex-start; }
button.choice.loot > span b { display: block; font-size: 1.15rem; margin-bottom: .2rem; }

/* ---------- Fur Coat: marked fights ---------- */
.map .node.marked circle { stroke: #c79a3a; stroke-width: 3.5; stroke-dasharray: 4 3; }

.choice.gift .medal { width: 46px; height: 46px; margin-bottom: .3rem; }

/* ---------- the Veiled ---------- */
.sigil.veiled .body { fill: #23312a; stroke: #7fb08a; }
.sigil.veiled .eye { fill: #b8e0b0; stroke: #b8e0b0; }
.card.col-veiled .cname { letter-spacing: .01em; }

/* ---------- hover tooltips ---------- */
.hovertip {
  position: fixed; z-index: 120; pointer-events: none; display: flex; gap: .6rem; align-items: flex-start;
  max-width: min(320px, calc(100vw - 16px)); padding: .6rem .75rem; border-radius: 10px;
  background: var(--panel); color: var(--ink); border: 1.5px solid var(--brass); box-shadow: 0 10px 28px rgba(0,0,0,.35);
  font-size: .92rem; line-height: 1.35;
}
.hovertip[hidden] { display: none; }
.hovertip b { display: block; font-family: var(--disp); font-size: 1.05rem; }
.hovertip small { display: block; color: var(--ink2); font-size: .78rem; margin: .05rem 0 .25rem; }
.hovertip p { margin: 0; }
.hovertip .tticon { width: 40px; height: 40px; flex: 0 0 auto; }
@media (prefers-reduced-motion: no-preference) { .hovertip:not([hidden]) { animation: fade .12s ease-out; } }

/* ---------- phones: touch comfort ---------- */
html, body { overscroll-behavior: none; }
body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
input, textarea, .log, .infotext { user-select: text; -webkit-user-select: text; }
/* Small controls get a 44px tap area without changing how they look. */
@media (pointer: coarse) {
  .relic, .vial, .chip, .deckbtn { position: relative; }
  .relic::after, .vial::after, .deckbtn::after { content: ''; position: absolute; left: -3px; right: -3px; top: -9px; bottom: -9px; }
  /* the strip scrolls sideways, which clips overflow; give the tap areas room inside it */
  .bar .inv { padding-top: 9px; padding-bottom: 9px; margin-top: -9px; margin-bottom: -9px; }
  .chip::after { content: ''; position: absolute; left: -2px; right: -2px; top: -11px; bottom: -11px; }
  .dock button, .rest button, .shop button, .reward button, .overlay button, .event button { min-height: 44px; }
}
/* Notches and the home indicator. */
.bar { padding-left: max(.5rem, env(safe-area-inset-left, 0px)); padding-right: max(.5rem, env(safe-area-inset-right, 0px)); }
.dock { padding-left: max(.5rem, env(safe-area-inset-left, 0px)); padding-right: max(.5rem, env(safe-area-inset-right, 0px)); padding-bottom: max(.6rem, env(safe-area-inset-bottom, 0px)); }

/* ---------- phones: the whole hand fits, and the first tap lifts a card ---------- */
@media (max-width: 760px), (max-height: 520px) and (orientation: landscape) {
  .dock .hand { overflow: visible; justify-content: center; padding-left: 0; }
  .hand .card { transform: none; touch-action: none; margin: 0; }
  .hand .card + .card { margin-left: calc(var(--m, 2px) * 2); }
  .hand .card:hover, .hand .card:focus-visible { transform: translateY(-8px); }
  .hand .card.sel {
    transform: translate(var(--lx, 0px), var(--ly, -120px)) scale(var(--ls, 1.6)); transform-origin: 50% 50%; z-index: 40;
    box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 2px var(--focus);
    transition: transform .2s cubic-bezier(.2,.8,.3,1.1), box-shadow .2s;
  }
  .hand .card.sel .tips { display: none; }
  .combat > .hint { padding: 0 .6rem; }
}

/* ---------- phones held sideways: everything fits the short screen ---------- */
@media (max-height: 520px) and (orientation: landscape) {
  /* only the hand shrinks; rewards, the shop and the deck keep full-size cards */
  .dock { --cw: 96px; --ch: 140px; --ah: 46px; }
  #app:has(> main.combat) { height: 100dvh; min-height: 0; overflow: hidden; }
  .bar { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: .2rem .6rem; padding-top: max(.25rem, env(safe-area-inset-top, 0px)); padding-bottom: .25rem; }
  .bar .who { display: none; }
  .bar .stats { font-size: .9rem; gap: .7rem; }
  .bar .inv { grid-column: auto; }
  .bar .deckbtn { padding: .15em .6em; font-size: .85rem; }
  .combat { min-height: 0; grid-template-rows: minmax(0, 1fr) auto auto; }
  .arena { flex-direction: row; flex-wrap: nowrap; align-items: center; justify-content: space-between; padding: .2rem 1rem 0; gap: 1rem; min-height: 0; }
  .foes { flex-wrap: nowrap; gap: .6rem; }
  .me .sigil { width: 50px; height: 50px; }
  .foe .sigil { width: 46px; height: 46px; }
  .me, .foe { min-width: 0; padding: .05rem .3rem; gap: 0; }
  .fname { font-size: .8rem; }
  .hpbar, .foe .hpbar { width: 84px; }
  .intent { min-height: 18px; font-size: .85rem; }
  .combat > .hint { font-size: .8rem; min-height: 1.2em; }
  .dock { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: none; align-items: end; gap: .5rem; padding-top: 0; }
  .dock .hand { grid-area: auto; padding: 6px 0 2px; min-height: calc(var(--ch) + 8px); }
  .dock .left { grid-area: auto; flex-direction: column; align-items: center; gap: .3rem; }
  .dock .right { grid-area: auto; display: grid; grid-template-columns: auto auto; gap: .3rem; align-items: stretch; }
  .dock .right [data-act=end] { grid-column: 1 / -1; }
  .dock button { padding: .2em .55em; font-size: .85rem; }
  .energy { width: 48px; height: 48px; }
  .energy span { font-size: 1.35rem; }
  .dock .card { padding: .95rem .3rem .3rem; }
  .dock .ctext { font-size: .6rem; }
  .dock .ctext.long { font-size: .55rem; }
  .dock .cname { font-size: .8rem; }
  .banner { font-size: 1.4rem; padding: .3rem 2.5rem; }
}

/* Touch screens keep :hover on the last tapped element; never let it lift a card over its neighbours. */
@media (hover: none) {
  .hand .card:hover, .hand .card:focus-visible { transform: none; z-index: auto; box-shadow: none; }
  .hand .card.sel:hover { transform: translate(var(--lx, 0px), var(--ly, -120px)) scale(var(--ls, 1.6)); z-index: 40; }

.infotext .glossary p.gl { font-size: .95rem; }

.hovertip .card b { display: inline; font-family: inherit; font-size: inherit; }

.playline { position: fixed; left: 0; right: 0; height: 0; border-top: 2px dashed color-mix(in srgb, var(--ink2) 55%, transparent); z-index: 55; pointer-events: none; text-align: center; transition: border-color .12s; }

  color: #fff4e0; background: linear-gradient(#b23a2a, #7d2218); border: 1px solid #e0a35a; vertical-align: middle; }

@media (min-width: 761px) and (min-height: 521px) {

main.combat { grid-template-columns: minmax(0, 1fr); }
.arena, .foes, .dock { min-width: 0; }

  .arena { align-items: flex-end; padding-bottom: clamp(8px, 4vh, 48px); }

  HD.relicPool = (rarity, run) => Object.values(R)

      }
    }
    if (HD.setNames && HD.nameMode) HD.setNames(HD.nameMode);
  };
  HD.versionPatch = PATCH;
})();

// Combat engine. Pure logic; the UI talks to it through ui.choose / ui.fx / ui.pace.
(function () {
  const HD = globalThis.HD;
  const CARDS = HD.CARDS;
  const TICK = ['exposed', 'sapped', 'brittle', 'dampened'];

  class Combat {
    constructor(run, encId, ui, kind = 'monster') {
      this.run = run;
      this.ui = ui || HD.autoUI;
      this.kind = kind;
      this.rng = run.rng.combat;
      this.mrng = run.rng.monster;
      this.encId = encId;
      this.enc = HD.ENC[encId];
      this.p = { isPlayer: true, name: HD.charName(run.charId), hp: run.hp, maxHp: run.maxHp, block: 0, pw: {}, fresh: {} };
      this.maxEnergy = 3;
      this.energy = 0;
      this.turn = 0;
      this.over = false;
      this.won = false;
      this.phase = 'start';
      this.draw = []; this.hand = []; this.discard = []; this.ash = [];
      this.t = this.freshTurn();
      this.lostHpTimes = 0;
      this.hpLostFirst = false;
      this.hpLostPhase = 0;
      this.firstTurnEnergy = 0;
      this.firstTurnDraw = 0;
      this.extraDrawThisTurn = 0;
      this.leftover = 0;
      this.rs = {}; // per-combat relic flags
      this.enemies = [];
      this.log = [];
    }
    freshTurn() { return { cards: 0, attacks: 0, skills: 0, powers: 0, played: 0, types: new Set(), lostHp: false, burned: false, blockFromCard: false }; }

    // ---------- setup ----------
    makeCard(id, up) { return { uid: HD.uid(), id, up: !!up, bonus: 0 }; }
    spawn(id, o = {}) {
      let d = HD.MON[id];
      const asc = (this.run && this.run.asc) || 0;
      const A = asc >= 8 && HD.ASC_MON ? (HD.ASC_MON[HD.version === 'stable' ? 'stable' : '0.111'] || {})[id] : null;

    // ---------- piles ----------
    async reshuffle() {

      let gold = kind === 'boss' ? 100 : kind === 'elite' ? this.rng.gold.range(35, 45) : this.rng.gold.range(10, 20);
      if (this.asc >= 3) gold = Math.floor(gold * 0.75);
      if (this.hasRelic('VIOLET_GOURD')) gold += 15;
      items.push({ kind: 'gold', n: gold });
      const pot = this.rollPotionDrop(kind);
      if (pot && !this.hasRelic('DRY_FLASK')) items.push({ kind: 'potion', id: pot });
      if (kind === 'elite') for (let i = 0; i < (this.hasRelic('DARK_STAR') ? 2 : 1); i++) { const r = this.rollRelic(); if (r) items.push({ kind: 'relic', id: r }); }
      if (kind === 'boss' && this.act === 1 && this.hasRelic('MAGMA_PEBBLE')) for (let i = 0; i < 2; i++) { const r = this.rollRelic(); if (r) items.push({ kind: 'relic', id: r }); }
      const picks = [this.rewardCards(kind)];
      if (kind === 'monster' && this.hasRelic('SPINNING_WHEEL')) picks.push(this.rewardCards(kind));
      if (kind === 'elite' && this.hasRelic('PALE_STAR')) picks.push(this.rewardCards('elite', 'Rare'));
      if (this.hasRelic('LONG_SWEET') && this.combats % 2 === 0) {
        const powers = HD.POOL(this.color).filter((d) => d.type === 'Power');
        for (const p of picks) { const extra = this.rng.cards.pick(powers.filter((d) => !p.some((c) => c.id === d.id))); p.push({ id: extra.id, up: false }); }
      }
      if (this.hasRelic('MAGMA_LAMP') && g && g.lostHpTimes === 0) for (const p of picks) for (const c of p) if (CARDS[c.id].type !== 'Status') c.up = true;
      for (let i = 0; i < ((g && g.extraCardReward) || 0); i++) picks.push(this.rewardCards(kind));
      for (const p of picks) items.push({ kind: 'cards', cards: p });
      return items;
    }

    // ---------- relics ----------
    // 50% common, 33% uncommon, 17% rare; an empty tier falls through to the next one up.
    rollRelic() {
      const r = this.rng.relic.next();
      const order = ['Common', 'Uncommon', 'Rare'];
      let i = r < 0.5 ? 0 : r < 0.83 ? 1 : 2;
      for (; i < order.length; i++) { const pool = HD.relicPool(order[i], this); if (pool.length) return this.rng.relic.pick(pool); }
      return null;
    }
    treasure() {
      const tc = this.relic('TIN_CRUCIBLE');
      if (tc && !tc.used) { tc.used = true; return { gold: 0, relic: null, empty: true }; }
      const g = this.rng.gold.range(42, 52);
      return { gold: this.asc >= 3 ? Math.floor(g * 0.75) : g, relic: this.rollRelic() };
    }

    // ---------- rest ----------
    restHeal() { return Math.floor(this.maxHp * 0.3) + (this.hasRelic('DOWN_PILLOW') ? 15 : 0); }
    restOptions() {
      const o = ['rest', 'smith'];
      const kb = this.relic('KETTLEBELL');
      if (kb && (kb.lifts || 0) < 3) o.push('lift');
      if (this.hasRelic('SPADE')) o.push('dig');
      if (this.deck.some((c) => c.id === 'ROC_EGG')) o.push('hatch');
      if (this.deck.some((c) => c.ench && c.ench.id === 'CLONE')) o.push('clone');
      return o;
    }

    // ---------- shop ----------
    priceMult() { return (this.hasRelic('GUILD_TOKEN') ? 0.5 : 1) * (this.hasRelic('THE_RUNNER') ? 0.8 : 1); }
    removalCost() { return Math.round((75 + 25 * this.removals) * this.priceMult()); }
    shopCard(type, taken) {
      const sh = this.rng.shop;
      const pool = HD.POOL(this.color);
      let rar = this.rollRarity('shop', false);
      if (type === 'Power' && rar === 'Common') rar = 'Uncommon';
      let cands = pool.filter((d) => d.type === type && d.rarity === rar && !taken.includes(d.id));
      if (!cands.length) cands = pool.filter((d) => d.type === type && !taken.includes(d.id));
      const d = sh.pick(cands);
      return { id: d.id, base: Math.round(CARD_PRICE[d.rarity] * sh.float(0.95, 1.05)), type };
    }
    shopRelic(rarity) {
      const sh = this.rng.shop;
      let pool = [];
      if (rarity === 'Shop') pool = HD.relicPool('Shop', this);
      else {
        const r = sh.next();
        const order = ['Common', 'Uncommon', 'Rare'];
        for (let i = r < 0.5 ? 0 : r < 0.83 ? 1 : 2; i < 3 && !pool.length; i++) pool = HD.relicPool(order[i], this);
      }
      pool = pool.filter((id) => !HD.RELICS[id].noShop && !(this.shop && this.shop.relics.some((x) => x.id === id)));
      if (!pool.length) return null;
      const id = sh.pick(pool);
      return { id, base: Math.round(RELIC_PRICE[HD.RELICS[id].rarity] * sh.float(0.85, 1.15)) };
    }
    shopColorless(rar) {
      const pool = HD.POOL('colorless').filter((d) => d.rarity === rar && !(this.shop && (this.shop.colorless || []).some((x) => x.id === d.id)));
      const d = this.rng.shop.pick(pool);
      return { id: d.id, rar, base: Math.round(CARD_PRICE[rar] * 1.15 * this.rng.shop.float(0.95, 1.05)) };
    }
    shopPotion() {
      const id = this.randomPotion();
      return { id, base: Math.round(POTION_PRICE[HD.POTIONS[id].rarity] * this.rng.shop.float(0.95, 1.05)) };
    }
    makeShop() {
      this.shop = { cards: [], relics: [], potions: [], removed: false };
      const s = this.shop;
      for (const type of ['Attack', 'Attack', 'Skill', 'Skill', 'Power']) s.cards.push(this.shopCard(type, s.cards.map((c) => c.id)));
      const sale = this.rng.shop.int(5);
      s.cards[sale].sale = true;
      for (const rar of ['any', 'any', 'Shop']) { const x = this.shopRelic(rar); if (x) s.relics.push(x); }
      for (let i = 0; i < 3; i++) s.potions.push(this.shopPotion());
      s.colorless = ['Uncommon', 'Rare'].map((rar) => this.shopColorless(rar));
      return s;
    }
    price(item) { return Math.round(item.base * (item.sale ? 0.5 : 1) * this.priceMult()); }
    // Buying empties the slot unless The Runner restocks it.
    buy(kind, i) {
      const s = this.shop;
      const it = s[kind][i];
      if (!it || it.sold) return false;
      const cost = this.price(it);
      if (this.gold < cost) return false;
      if (kind === 'potions' && this.freeSlot() < 0) return false;
      this.gold -= cost;
      if (kind === 'cards' || kind === 'colorless') this.addCard(it.id, false);
      if (kind === 'relics') this.addRelic(it.id);
      if (kind === 'potions') this.addPotion(it.id);
      if (this.hasRelic('THE_RUNNER')) {
        const next = kind === 'cards' ? this.shopCard(it.type, s.cards.map((c) => c.id)) : kind === 'colorless' ? this.shopColorless(it.rar) : kind === 'relics' ? this.shopRelic('any') : this.shopPotion();
        s[kind][i] = next || { sold: true };
      } else it.sold = true;
      return true;
    }
  }
  // Save and resume: plain data plus the position of every RNG stream.
  const SAVE_SKIP = new Set(['rng', 'deck', 'feed']);
  Run.prototype.toSave = function () {
    const data = {};
    for (const [k, v] of Object.entries(this)) if (!SAVE_SKIP.has(k)) data[k] = v;
    data.deck = this.deck.map((c) => ({ id: c.id, up: c.up, left: c.left, ench: c.ench, rider: c.rider }));
    const rng = {};
    for (const [k, r] of Object.entries(this.rng)) rng[k] = r.getState();
    return JSON.parse(JSON.stringify({ seed: this.seed, data, rng }));
  };
  Run.fromSave = function (o) {
    const r = new Run(o.seed, (o.data && o.data.charId) || 'OATHBURNER');
    Object.assign(r, o.data);
    r.deck = o.data.deck.map((c) => Object.assign(r.newCard(c.id, c.up), c.left != null ? { left: c.left } : {}, c.ench ? { ench: c.ench } : {}, c.rider ? { rider: c.rider } : {}));
    for (const [k, v] of Object.entries(o.rng)) if (r.rng[k]) r.rng[k].setState(v);
    return r;
  };
  HD.Run = Run;
})();

  rareSkill('HIDDEN_FORM', { name: 'Hidden Form', cost: 0, kw: ['Burn'], upKw: [], text: () => 'Put a Skill from your draw pile into your hand.',
    play: async (g) => { const [x] = await pickFrom(g, g.draw, (y) => CARDS[y.id].type === 'Skill', 0, 'Choose a Skill'); if (x) { g.draw.splice(g.draw.indexOf(x), 1); g.addToHand(x); } } });
  rareSkill('HIDDEN_BLADE', { name: 'Hidden Blade', cost: 0, kw: ['Burn'], upKw: [], text: () => 'Put an Attack from your draw pile into your hand.',
    play: async (g) => { const [x] = await pickFrom(g, g.draw, (y) => CARDS[y.id].type === 'Attack', 0, 'Choose an Attack'); if (x) { g.draw.splice(g.draw.indexOf(x), 1); g.addToHand(x); } } });
  rareSkill('ALL_IN', { name: 'All In', cost: 0, v: { blk: 50 }, up: { blk: 25 }, text: (v, f) => `Gain ${f.b(v.blk)} Guard. If an Attack gets through your Guard this combat, you die.`,
    play: async (g, c, t, v) => { await g.gainBlock(v.blk, true); g.p.pw.gambit = 1; } });

  // ---------- co-op only ----------
  const coop = (id, name, type, rarity, cost, target) => card(id, { name, type, rarity, cost, target, coop: true, text: () => 'Co-op only.', play: async () => {} });
  coop('HOPE_BEACON', 'Hope Beacon', 'Power', 'Rare', 1, 'self'); coop('OWN_BELIEF', 'Belief', 'Skill', 'Uncommon', 0, 'self');
  coop('COORDINATED', 'Coordinate Strike', 'Skill', 'Uncommon', 1, 'self'); coop('PILE_ON', 'Pile On', 'Attack', 'Uncommon', 1, 'enemy');
  coop('HUDDLE', 'Huddle', 'Skill', 'Uncommon', 1, 'self'); coop('TAKE_THE_BLOW', 'Take the Blow', 'Skill', 'Uncommon', 1, 'self');
  coop('KNOCK_OVER', 'Knock Over', 'Attack', 'Rare', 3, 'enemy'); coop('BOOST', 'Boost', 'Skill', 'Uncommon', 1, 'self');
  coop('COPYCAT', 'Copycat', 'Skill', 'Rare', 1, 'self'); coop('RALLY_CRY', 'Rally Cry', 'Skill', 'Rare', 2, 'self'); coop('DOUBLE_TEAM', 'Double Team', 'Attack', 'Uncommon', 2, 'enemy');

  // ---------- potion and relics that hand out colorless cards ----------
  const colorlessReward = (run, n) => {
    const out = [];
    for (let i = 0; i < n; i++) {
      const rar = run.rng.cards.next() < 0.03 ? 'Rare' : 'Uncommon';
      const pool = HD.POOL('colorless').filter((d) => d.rarity === rar && !out.some((c) => c.id === d.id));
      out.push({ id: run.rng.cards.pick(pool).id, up: false });
    }
    return out;
  };
  HD.colorlessReward = colorlessReward;
  HD.POTIONS.GREY_TINCTURE = { id: 'GREY_TINCTURE', name: 'Grey Tincture', rarity: 'Common', target: 'self', pool: 'shared',
    text: 'Choose 1 of 3 random colorless cards to add to your hand. It is free this turn.',
    use: async (g) => {
      const opts = g.rng.shuffle(HD.colorlessIds(true)).slice(0, 3).map((id) => g.makeCard(id, false));
      const [x] = await g.choose({ from: opts, n: 1, prompt: 'Choose a colorless card' });
      if (x) { x.freeTurn = true; g.addToHand(x); }
    } };
  const relic = (id, o) => { HD.RELICS[id] = Object.assign({ id, pool: 'shared' }, o); };
  relic('TOOL_KIT', { rarity: 'Shop', name: 'Tool Kit', text: 'At the start of each combat, choose 1 of 3 random colorless cards and add it to your hand.',
    firstHand: async (g) => {
      const opts = g.rng.shuffle(HD.colorlessIds(true)).slice(0, 3).map((id) => g.makeCard(id, false));
      const [x] = await g.choose({ from: opts, n: 1, prompt: 'Tool Kit: choose a colorless card' });
      if (x) g.addToHand(x);
    } });
  relic('WORN_RUG', { rarity: 'Shop', name: 'Worn Rug', text: 'Card rewards can now contain colorless cards.' });
  relic('LEAD_WEIGHT', { rarity: 'Ancient', pool: 'neow', name: 'Lead Weight', text: 'On pickup, choose 1 of 2 colorless cards to add to your deck.',
    onPickup: (run) => { run.pending.push({ kind: 'cards', cards: colorlessReward(run, 2) }); } });
  HD.NEOW.boons.push('LEAD_WEIGHT');
})();

// Enchantments: permanent per-card modifiers that last the whole run. One per card.
// A card carries { ench: { id, n } }; the engine reads it for cost, damage, Guard, keywords, draws, shuffles and plays.
(function () {
  const HD = globalThis.HD;
  const CARDS = HD.CARDS;
  const isAtk = (d) => d.type === 'Attack';
  const isSkill = (d) => d.type === 'Skill';
  const gainsBlock = (d) => d.v && d.v.blk != null;
  const tagged = (tag) => (d) => (d.tags || []).includes(tag);
  const playable = (d) => ['Attack', 'Skill', 'Power'].includes(d.type);

  HD.ENCH = {
    ADROIT: { name: 'Adroit', extra: (n) => `Gain ${n} Guard.`,  fits: playable, text: (n) => `Gain ${n} Guard.`, after: async (g, c, t, n) => g.gainBlock(n, false) },
    CLONE: { name: 'Clone', fits: playable, text: () => 'Can be copied at Rest Sites.' },
    CORRUPTED: { name: 'Corrupted', extra: () => 'Lose 2 HP.',  fits: isAtk, text: () => 'Deals 50% more damage. Lose 2 HP.', mult: 1.5, after: async (g) => g.selfLoseHp(2) },
    GLAM: { name: 'Glam', fits: playable, text: () => 'Replays once per combat.', replay: (c) => { if (c.glamUsed) return 0; c.glamUsed = true; return 1; } },
    GOOPY: { name: 'Goopy', extra: () => "Permanently increase this card's Guard by 1.",  fits: tagged('Brace'), kwAdd: ['Burn'], text: (n) => `Burn. Gains 1 Guard for good each time it is played${n ? ` (+${n})` : ''}.`, blockAdd: (n) => n,
      after: async (g, c) => { c.ench.n++; if (c.src && c.src.ench) c.src.ench.n++; } },
    IMBUED: { name: 'Imbued', fits: isSkill, text: () => 'Played automatically at the start of each combat.' },
    // Inky: +1 damage on the stable branch; v0.111 removed the bonus damage and kept the Weak.
    INKY: { name: 'Inky', extra: () => 'Apply 1 Sapped.', fits: playable, text: () => (HD.version === 'stable' ? 'Deals 1 more damage and applies 1 Sapped.' : 'Applies 1 Sapped.'),
      dmgAdd: () => (HD.version === 'stable' ? 1 : 0),
      after: async (g, c, t) => { const e = t && t.alive ? t : null; if (e) await g.apply(e, 'sapped', 1); } },
    INSTINCT: { name: 'Instinct', fits: isAtk, text: () => 'Deals double Attack damage.', mult: 2 },
    MOMENTUM: { name: 'Momentum', extra: (n) => `Increase this card's damage by ${n} this combat.`,  fits: isAtk, text: (n) => `Deals ${n} more damage each time it is played this combat.`, dmgAdd: (n, c) => c.momentum || 0,
      after: async (g, c, t, n) => { c.momentum = (c.momentum || 0) + n; } },
    NIMBLE: { name: 'Nimble', fits: gainsBlock, text: (n) => `Gains ${n} more Guard.`, blockAdd: (n) => n },
    PERFECT_FIT: { name: 'Perfect Fit', fits: playable, text: () => 'Goes on top of your draw pile whenever it is shuffled in.' },
    ROYALLY_APPROVED: { name: 'Royally Approved', fits: (d) => isAtk(d) || isSkill(d), kwAdd: ['Opening', 'Retain'], text: () => 'Opening. Retain.' },
    SHARP: { name: 'Sharp', fits: isAtk, text: (n) => `Deals ${n} more damage.`, dmgAdd: (n) => n },
    SLITHER: { name: 'Slither', fits: (d) => playable(d) && typeof d.cost === 'number', text: () => 'Costs a random 0 to 3 when drawn.' },
    SLUMBERING_ESSENCE: { name: 'Slumbering Essence', fits: playable, text: () => 'Costs 1 less for each turn it stays in your hand, until played.' },
    SOULS_POWER: { name: "Soul's Power", fits: (d) => (d.kw || []).includes('Burn'), kwDrop: ['Burn'], text: () => 'No longer Burns.' },
    SOWN: { name: 'Sown', extra: (n) => `Gain ${n} Energy the first time this is played.`,  fits: playable, text: (n) => `The first time you play it each combat, gain ${n} Energy.`,
      after: async (g, c, t, n) => { if (!c.sownUsed) { c.sownUsed = true; g.gainEnergy(n); } } },
    SPIRAL: { name: 'Spiral', fits: (d) => d.rarity === 'Basic' && (tagged('Cut')(d) || tagged('Brace')(d)), text: () => 'Replay 1.', replay: () => 1 },
    STEADY: { name: 'Steady', fits: playable, kwAdd: ['Retain'], text: () => 'Retain.' },
    SWIFT: { name: 'Swift', extra: (n) => `Draw ${n} card${n > 1 ? 's' : ''} the first time this is played.`,  fits: playable, text: (n) => `The first time you play it each combat, draw ${n} card${n > 1 ? 's' : ''}.`,
      after: async (g, c, t, n) => { if (!c.swiftUsed) { c.swiftUsed = true; await g.drawCards(n); } } },
    TEZCATARAS_EMBER: { name: 'Old Ember', fits: playable, kwAdd: ['Eternal'], text: () => 'Costs 0. Deals 3 more damage. Eternal.', dmgAdd: () => 3, free: true },
    VIGOROUS: { name: 'Vigorous', fits: isAtk, text: (n) => `The first time it is played each combat, it deals ${n} more damage.`, dmgAdd: (n, c) => (c.vigorUsed ? 0 : n),
      after: async (g, c) => { c.vigorUsed = true; } },
  };
  // Cards in the deck that can take this enchantment (one enchantment per card).
  HD.Run.prototype.enchantable = function (id, filter) {
    const e = HD.ENCH[id];
    return this.deck.filter((c) => !c.ench && e.fits(CARDS[c.id]) && (!filter || filter(CARDS[c.id])));
  };
  HD.Run.prototype.enchant = function (c, id, n = 0) {
    if (!c || c.ench) return;
    c.ench = { id, n };
    this.note({ kind: 'enchanted', id: c.id, up: c.up, ench: { id, n } });
  };

  // ---------- relics that apply enchantments ----------
  const relic = (id, o) => { HD.RELICS[id] = Object.assign({ id, rarity: 'Shop', pool: 'shared' }, o); };
  const picks = (run, k, o) => { for (let i = 0; i < k; i++) run.pending.push(Object.assign({ kind: 'enchant' }, o)); };
  relic('KNOTTED_MALLET', { name: 'Knotted Mallet', text: 'On pickup, Enchant up to 3 Attacks with Sharp 3.',
    onPickup: (run) => picks(run, 3, { id: 'SHARP', n: 3, filter: 'Attack', optional: true }) });
  relic('CHARM_TAGS', { name: 'Charm Tags', text: 'On pickup, Enchant up to 3 cards with Adroit.',
    onPickup: (run) => picks(run, 3, { id: 'ADROIT', n: 3, optional: true }) });
  relic('FIST_BLADE', { name: 'Fist Blade', text: 'On pickup, Enchant an Attack with Momentum 5.', onPickup: (run) => picks(run, 1, { id: 'MOMENTUM', n: 5, filter: 'Attack' }) });
  relic('COURT_SEAL', { name: 'Court Seal', text: 'On pickup, Enchant an Attack or Skill with Royally Approved.', onPickup: (run) => picks(run, 1, { id: 'ROYALLY_APPROVED' }) });
  relic('ODD_LIGHTER', { name: 'Odd Lighter', text: 'Enchanted Attacks deal 9 additional damage.' });
  relic('FEATHER_CHARM', { name: 'Feather Charm', text: 'A random card in each card reward is Enchanted with Swift 1.' });
  relic('SILK_LOCK', { name: 'Silk Lock', rarity: 'Ancient', pool: 'neow', bane: true, text: 'On pickup, lose all Gold. Enchant every card in your first card reward with Glam.',
    onPickup: (run) => { run.gold = 0; run.glamNext = true; } });
  HD.NEOW.banes.push('SILK_LOCK');

  // Card rewards: Feather Charm and Silk Lock enchant the cards on offer.
  const baseReward = HD.Run.prototype.cardReward;
  HD.Run.prototype.cardReward = function (...args) {
    const cards = baseReward.apply(this, args);
    if (this.glamNext) { this.glamNext = false; for (const c of cards) if (HD.ENCH.GLAM.fits(CARDS[c.id])) c.ench = { id: 'GLAM', n: 0 }; }
    if (this.hasRelic('FEATHER_CHARM')) { const xs = cards.filter((c) => !c.ench && HD.ENCH.SWIFT.fits(CARDS[c.id])); if (xs.length) this.rng.cards.pick(xs).ench = { id: 'SWIFT', n: 1 }; }
    return cards;
  };

  // ---------- events that enchant ----------
  const EV = HD.EVENTS;
  const seed = EV.BLUE_SEED.pages.INITIAL.options.find((o) => o.id === 'PLANT');
  Object.assign(seed, { desc: () => 'Enchant a card with Sown.', lock: (run) => (run.enchantable('SOWN').length ? null : 'No card can be Enchanted.'),
    go: (run) => { run.pending.push({ kind: 'enchant', id: 'SOWN', n: 1 }); return 'PLANT'; } });
  EV.BLUE_SEED.pages.PLANT = { text: 'You press the seed into a card. Something takes root there.' };
  const snake = EV.BARK_CARVINGS.pages.INITIAL.options.find((o) => o.id === 'SNAKE');
  Object.assign(snake, { desc: () => 'Enchant 1 card with Slither.', lock: (run) => (run.enchantable('SLITHER').length ? null : 'None of your cards can be Enchanted with Slither.'),
    go: (run) => { run.pending.push({ kind: 'enchant', id: 'SLITHER', n: 0 }); return 'DONE'; } });
  const book = (type, id, n) => ({ id: `${type}_${id}`, label: { Attack: 'Read the back', Skill: 'Read a passage', Power: 'Read the whole book' }[type],
    desc: () => `Choose ${type === 'Attack' ? 'an' : 'a'} ${type} to Enchant with ${HD.ENCH[id].name} ${n}.`,
    lock: (run) => (run.enchantable(id, (d) => d.type === type).length ? null : `You have no ${type}s that can be Enchanted.`),
    go: (run) => { run.pending.push({ kind: 'enchant', id, n, filter: type }); return 'DONE'; } });
  EV.SELF_HELP = { id: 'SELF_HELP', name: 'Self-Help Book', act: 'any', pages: {
    INITIAL: { text: 'A book lies open on a stump: "Become Your Best Self in Three Easy Steps." Most of the pages are stuck together.',
      options: [book('Attack', 'SHARP', 2), book('Skill', 'NIMBLE', 2), book('Power', 'SWIFT', 2),
        // In the original, Move On only appears when nothing can be enchanted.
        { id: 'MOVE_ON', label: 'Move on', desc: () => 'You have no cards that can be Enchanted.',
          lock: (run) => (['Attack', 'Skill', 'Power'].some((ty) => run.enchantable({ Attack: 'SHARP', Skill: 'NIMBLE', Power: 'SWIFT' }[ty], (d) => d.type === ty).length) ? 'You still have cards to Enchant.' : null),
          go: () => 'LEAVE' }] },
    DONE: { text: 'You skim a chapter, and one of your habits gets a little sharper.' },
    LEAVE: { text: 'Some books are best left unread.' },
  } };
})();

// Act 2 and 3 events, and the shared events that start appearing in Act 2.
// Numbers follow the reference data; all event text is Hollowdeep's own.
(function () {
  const HD = globalThis.HD;
  const CARDS = HD.CARDS;
  const EV = HD.EVENTS;
  const ev = (id, o) => { EV[id] = Object.assign({ id, act: 2 }, o); };
  const loseHp = (run, n) => { run.hp -= n; };
  const loseGold = (run, n) => { run.gold = Math.max(0, run.gold - n); };
  const potion = (run, rar) => { const id = rar ? run.rng.event.pick(HD.potionPool(rar, run.color)) : run.randomPotion(); if (!run.addPotion(id)) run.pending.push({ kind: 'potion', id }); };
  const relic = (run) => { const id = run.rollRelic(); if (id) run.addRelic(id); };
  const basics = (run, tag) => run.removable().filter((c) => CARDS[c.id].rarity === 'Basic' && CARDS[c.id].tags.includes(tag));
  const upgradeRandom = (run, n) => run.rng.event.shuffle(run.deck.filter((c) => !c.up && ['Attack', 'Skill', 'Power'].includes(CARDS[c.id].type))).slice(0, n).forEach((c) => run.upgrade(c));
  const downgradeRandom = (run, n) => run.rng.event.shuffle(run.deck.filter((c) => c.up)).slice(0, n).forEach((c) => { c.up = false; run.note({ kind: 'downgraded', id: c.id }); });
  const classCard = (run, f) => run.rng.event.pick(HD.POOL(run.color).filter(f)).id;
  const tradeable = (run) => run.relics.filter((r) => HD.RELICS[r.id] && HD.RELICS[r.id].rarity !== 'Starter');
  const gold = (n) => `Gain ${n} Gold.`;

  // ---------- Act 2 ----------
  ev('FUSER', { name: 'The Fuser', when: (run) => basics(run, 'Cut').length >= 2 && basics(run, 'Brace').length >= 2, pages: {
    INITIAL: { text: 'A humming contraption with two slots and a lever. A scrawled note says it can turn two of something into one better something.',
      options: [
        { id: 'STRIKES', label: 'Fuse Cuts', desc: () => 'Remove 2 Cut cards. Add Final Cut to your deck.',
          go: (run) => { basics(run, 'Cut').slice(0, 2).forEach((c) => run.removeCard(c)); run.addCard('FINAL_CUT'); return 'DONE'; } },
        { id: 'DEFENDS', label: 'Fuse Braces', desc: () => 'Remove 2 Brace cards. Add Final Brace to your deck.',
          go: (run) => { basics(run, 'Brace').slice(0, 2).forEach((c) => run.removeCard(c)); run.addCard('FINAL_BRACE'); return 'DONE'; } },
      ] },
    DONE: { text: 'The machine shudders, spits out one card, and goes quiet.' },
  } });
  ev('BUG_HUNTER', { name: 'Bug Hunter', pages: {
    INITIAL: { text: 'A veteran exterminator offers to teach you a trick or two, for free. The hive has been bad for business.',
      options: [
        { id: 'EXTERMINATE', label: 'Learn to sweep', desc: () => 'Add Pest Sweep to your deck.', go: (run) => { run.addCard('PEST_SWEEP'); return 'DONE'; } },
        { id: 'SQUASH', label: 'Learn to squash', desc: () => 'Add Stomp Flat to your deck.', go: (run) => { run.addCard('STOMP_FLAT'); return 'DONE'; } },
      ] },
    DONE: { text: '"Aim for the soft bits," the exterminator says, and wanders off.' },
  } });
  const bloom = (depth) => {
    const gain = [35, 75, 135][depth];
    const opts = [{ id: 'EXTRACT', label: 'Take the nectar', desc: () => gold(gain), go: (run) => { run.gainGold(gain); return 'TAKEN'; } }];
    if (depth < 2) opts.push({ id: 'DEEPER', label: 'Reach deeper', desc: () => `Go deeper. Lose ${[5, 6][depth]} HP.`, go: (run) => { loseHp(run, [5, 6][depth]); return `DEEP_${depth + 1}`; } });
    else opts.push({ id: 'CENTER', label: 'Enter the center', desc: () => 'Lose 7 HP. Obtain the Pollen Heart.', go: (run) => { loseHp(run, 7); run.addRelic('POLLEN_HEART'); return 'CORE'; } });
    return { text: ['A flower the size of a house, its petals sticky with golden nectar.', 'The petals close in around you. The nectar here is thicker.', 'At the very heart of the flower, something pulses with warm light.'][depth], options: opts };
  };
  ev('GIANT_BLOOM', { name: 'Giant Bloom', when: (run) => run.hp >= 19, pages: {
    INITIAL: bloom(0), DEEP_1: bloom(1), DEEP_2: bloom(2),
    TAKEN: { text: 'You fill your pockets with nectar that hardens into something merchants will pay for.' },
    CORE: { text: 'You tear the glowing core free. The flower wilts around you.' },
  } });
  ev('FIELD_OF_HOLES', { name: 'Field of Holes', pages: {
    INITIAL: { text: 'A field pocked with holes, each one exactly your shape. One of them seems to be calling you.',
      options: [
        { id: 'RESIST', label: 'Resist', desc: () => 'Remove 2 cards from your deck. Add Routine to your deck.', go: (run) => { run.pending.push({ kind: 'remove' }, { kind: 'remove' }); run.addCard('ROUTINE'); return 'RESIST'; } },
        { id: 'ENTER', label: 'Climb into your hole', desc: () => 'Enchant a card with Perfect Fit.', lock: (run) => (run.enchantable('PERFECT_FIT').length ? null : 'No card can be Enchanted.'),
          go: (run) => { run.pending.push({ kind: 'enchant', id: 'PERFECT_FIT' }); return 'ENTER'; } },
      ] },
    RESIST: { text: 'You walk away, though part of you keeps looking back.' },
    ENTER: { text: 'It fits you perfectly. Something of yours fits perfectly now too.' },
  } });
  ev('INFESTED_MACHINE', { name: 'Infested Machine', pages: {
    INITIAL: { text: 'An old automaton, crawling with bugs. Its chest panel hangs open.',
      options: [
        { id: 'STUDY', label: 'Study it', desc: () => 'Obtain a random Power.', go: (run) => { run.addCard(classCard(run, (d) => d.type === 'Power')); return 'DONE'; } },
        { id: 'TOUCH', label: 'Touch the core', desc: () => 'Obtain a random card that costs 0.', go: (run) => { run.addCard(classCard(run, (d) => d.cost === 0)); return 'DONE'; } },
      ] },
    DONE: { text: 'The bugs scatter. You come away with an idea you did not have before.' },
  } });
  ev('STRAY_WISP', { name: 'Stray Wisp', roll: (run, r) => ({ gold: r.range(45, 75) }), pages: {
    INITIAL: { text: 'A little wisp of light drifts between the combs, lost and flickering.',
      options: [
        { id: 'CAPTURE', label: 'Catch it', desc: () => 'Add Mildew to your deck. Obtain the Wisp in a Jar.', go: (run) => { run.addCard('MILDEW'); run.addRelic('WISP_JAR'); return 'CAUGHT'; } },
        { id: 'SEARCH', label: 'Search nearby', desc: (v) => gold(v.gold), go: (run, v) => { run.gainGold(v.gold); return 'SEARCHED'; } },
      ] },
    CAUGHT: { text: 'The jar glows. Something in your pack starts to smell of damp.' },
    SEARCHED: { text: 'You let the wisp go and find a few coins where it had been hovering.' },
  } });
  ev('SOUL_GRAFTER', { name: 'Soul Grafter', pages: {
    INITIAL: { text: 'A figure with stitched hands offers to graft something into you. It will heal you, it says. Mostly.',
      options: [
        { id: 'LET_IN', label: 'Let it in', desc: () => 'Heal 25 HP. Add Shed Skin to your deck.', go: (run) => { run.heal(25); run.addCard('SHED_SKIN'); return 'DONE'; } },
        { id: 'REJECT', label: 'Refuse', desc: () => 'Lose 10 HP. Upgrade a card.', go: (run) => { loseHp(run, 10); run.pending.push({ kind: 'upgrade' }); return 'DONE'; } },
      ] },
    DONE: { text: 'The grafter shrugs and goes back to sewing.' },
  } });
  ev('LAMP_KEY', { name: 'The Lamp Key', pages: {
    INITIAL: { text: 'A softly glowing key lies on the path. A hooded stranger appears behind you. "That is mine, I think."',
      options: [
        { id: 'RETURN', label: 'Return the key', desc: () => 'Gain 100 Gold.', go: (run) => { run.gainGold(100); return 'RETURNED'; } },
        { id: 'KEEP', label: 'Keep the key', desc: () => 'Fight for the key.', go: () => 'KEEP' },
      ] },
    KEEP: { text: 'The stranger draws a flail. Only one of you is leaving with the key.', options: [{ id: 'FIGHT', label: 'Fight', desc: () => 'Start a fight.', go: () => ({ fight: 'HOODED_KNIGHT' }) }] },
    RETURNED: { text: 'The stranger thanks you and pays you handsomely.' },
  }, onWin: (run) => run.addCard('LAMP_KEY_CARD') });
  ev('CALM_WEAVER', { name: 'Calm Weaver', when: (run) => run.gold >= 125, pages: {
    INITIAL: { text: 'A huge, patient spider offers lessons in calm. Her rates are posted on a web.',
      options: [

  });
  HD.ANCIENTS.DARV.acts = [2, 3];
  HD.Run.prototype.ancientOffer = function () {
    // Ascension 2 (Weary Traveler): Ancients heal only 80% of your missing HP.
    this.hp = this.asc >= 2 ? this.hp + Math.floor((this.maxHp - this.hp) * 0.8) : this.maxHp;
    const ids = Object.keys(HD.ANCIENTS).filter((k) => (HD.ANCIENTS[k].acts || []).includes(this.act));
    this.ancient = this.rng.neow.pick(ids);
    return this.rng.neow.shuffle(HD.ANCIENTS[this.ancient].pool.filter((id) => !this.hasRelic(id))).slice(0, 3);
  };

  const restOpts = HD.Run.prototype.restOptions;
  HD.Run.prototype.restOptions = function () {
    const o = restOpts.call(this);
    if (this.hasRelic('BUTCHER_KNIFE')) o.push('cook');
    const candle = this.relic('GOURD_CANDLE');
    if (candle && !candle.charges) o.push('kindle');
    return o;
  };
  const reward = HD.Run.prototype.cardReward;
  HD.Run.prototype.cardReward = function (...args) {
    const cards = reward.apply(this, args);
    if (this.hasRelic('GLITTER')) for (const c of cards) if (!c.ench && HD.ENCH.GLAM.fits(CARDS[c.id])) c.ench = { id: 'GLAM', n: 0 };
    return cards;
  };
})();

// Switches displayed names between Hollowdeep's own and the original game's. Numbers and rules never change.
(function () {
  const HD = globalThis.HD;
  const O = HD.ORIGINAL;
  const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  // Plurals translate too ("3 Phantasms" becomes "3 Apparitions").
  const re = new RegExp(`\\b(${Object.keys(O.text).sort((a, b) => b.length - a.length).map(esc).join('|')})(s|es)?\\b`, 'g');
  const plural = (w) => (/(s|x|z|ch|sh)$/.test(w) ? `${w}es` : `${w}s`);
  // Saves the Hollowdeep value of a field the first time it is read. Always call it before overwriting.
  const base = (o, k) => { const hk = `${k}HD`; if (!(hk in o)) o[hk] = o[k]; return o[hk]; };
  const sub = (s) => (HD.nameMode === 'original' && typeof s === 'string' ? s.replace(re, (m, w, pl) => (pl ? plural(O.text[w]) : O.text[w])) : s);
  const wrap = (f) => (HD.nameMode === 'original' ? (...a) => sub(f(...a)) : f);
  HD.sub = sub;
  HD.setNames = function (mode) {
    HD.nameMode = mode === 'original' ? 'original' : 'hollowdeep';
    const on = HD.nameMode === 'original';
    for (const [id, d] of Object.entries(HD.CARDS)) {
      const n = base(d, 'name');
      d.name = (on && O.cards[id]) || n;
      if (typeof base(d, 'text') === 'function') d.text = wrap(d.textHD);
    }
    for (const [id, d] of Object.entries(HD.MON)) {
      const n = base(d, 'name');
      d.name = (on && O.monsters[id]) || n;
      for (const [mk, m] of Object.entries(d.moves)) { const mn = base(m, 'name'); m.name = (on && O.moves[id] && O.moves[id][mk]) || mn; }
    }
    for (const [id, d] of Object.entries(HD.ENC)) { const n = base(d, 'name'); d.name = (on && O.encounters[id]) || n; }
    for (const [id, d] of Object.entries(HD.EVENTS || {})) { const n = base(d, 'name'); d.name = (on && O.events[id]) || n; }
    for (const [kind, table] of [['relics', HD.RELICS], ['potions', HD.POTIONS]]) {
      for (const [id, d] of Object.entries(table)) { const n = base(d, 'name'); d.name = (on && O[kind][id]) || n; d.text = sub(base(d, 'text')); }
    }
    for (const [k, p] of Object.entries(HD.PW)) { const n = base(p, 'n'); p.n = (on && O.powers[k]) || sub(n); p.d = wrap(base(p, 'd')); }
    if (!HD.TERMS_HD) HD.TERMS_HD = HD.TERMS;
    HD.TERMS = on ? Object.fromEntries(Object.entries(HD.TERMS_HD).map(([k, v]) => [sub(k), sub(v)])) : HD.TERMS_HD;
    HD.CHAR_NAMES = on ? { OATHBURNER: 'Ironclad', VEILED: 'Silent' } : { OATHBURNER: 'Oathburner', VEILED: 'The Veiled' };
    HD.CHAR = HD.CHAR_NAMES.OATHBURNER;
    HD.ACT_NAMES = on ? { 1: 'Overgrowth', 2: 'Hive', 3: 'Glory' } : { 1: 'The Rootworks', 2: 'The Waxen Hive', 3: 'The Gilded Court' };
    HD.ACT = HD.ACT_NAMES[1];
  };
})();
