<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ece4d4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1914" media="(prefers-color-scheme: dark)">
<title>Hollowdeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/*CSS*/
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="app"><div class="boot"><p>Loading Hollowdeep.</p></div></div>
<div id="fx" aria-hidden="true"></div>
<svg id="aim" aria-hidden="true"><defs><marker id="aimhead" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0 10 5 0 10 3 5z"/></marker></defs><path id="aimtrail"/><path id="aimpath" marker-end="url(#aimhead)"/></svg>
<script>
// Show startup errors on the page instead of leaving it blank.
window.HD_FAIL = function (msg) {
  var a = document.getElementById('app');
  var text = String(msg || 'Unknown error').replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; });
  var html = '<div class="boot err"><h2>Hollowdeep hit an error</h2><p>' + text + '</p><p>Reload the page. If it keeps happening, send this message along.</p></div>';
  if (window.HD && window.HD.booted) {
    var bar = document.getElementById('errbar') || document.body.appendChild(document.createElement('div'));
    bar.id = 'errbar'; bar.setAttribute('role', 'alert'); bar.innerHTML = html;
  } else if (a) a.innerHTML = html;
};
window.addEventListener('error', function (e) { window.HD_FAIL(e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
window.addEventListener('unhandledrejection', function (e) { window.HD_FAIL(e.reason && e.reason.message ? e.reason.message : e.reason); });
</script>
<script>
/*JS*/
HD.boot();
HD.booted = true;
// Fonts load after the game is on screen, so a slow font server can never block it.
(function () {
  var l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Grenze+Gotisch:wght@500;700&display=swap';
  document.head.appendChild(l);
})();
</script>
</body>
</html>
